# Navigation Links
#   To link a homepage section, set the URL to `#` followed by the section's `id`
#   in `content/_index.md`.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: About
    url: '#about'
    weight: 10
  - name: Experience
    url: '#experience'
    weight: 15
  - name: Publications
    url: '#publications'
    weight: 20
  # Uncomment alongside the matching section in content/_index.md.
  # - name: Posts
  #   url: '#posts'
  #   weight: 30
  # - name: Projects
  #   url: '#projects'
  #   weight: 40
  # - name: Talks
  #   url: '#talks'
  #   weight: 50
  - name: Gallery
    url: '#gallery'
    weight: 55
  - name: Contact
    url: '#contact'
    weight: 60

  # Link to a PDF of your CV from the menu.
