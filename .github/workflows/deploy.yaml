name: Build and deploy site

on:
  push:
    branches: ["main"]
  # Build (without deploying) pull requests, to catch errors before merging.
  pull_request:
  # Run by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned to the version the Wowchemy v5 theme modules are tested with.
  HUGO_VERSION: "0.119.0"

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publish.outputs.enabled }}
    steps:
      # Publishing is manual for now: the site is deployed only when this workflow
      # is run by hand on `main` (Actions → Build and deploy site → Run workflow).
      # Every other run only builds the site as a check.
      # To publish automatically on every push to `main`, change
      # `github.event_name == 'workflow_dispatch'` to `github.event_name != 'pull_request'`.
      - name: Decide whether to publish
        id: publish
        run: echo "enabled=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch history for Hugo's .GitInfo and .Lastmod
          fetch-depth: 0

      # Hugo Modules (the theme) are fetched with Go.
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Configure GitHub Pages
        id: pages
        if: steps.publish.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        # When not publishing, BASE_URL is empty and the baseURL from config.yaml is used.
        run: hugo --gc --minify ${BASE_URL:+--baseURL "$BASE_URL/"}

      - name: Upload site artifact
        if: steps.publish.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
